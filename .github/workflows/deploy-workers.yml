name: Deploy Site to Cloudflare Workers

on:
  push:
    branches: [dev, main]

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare Types
        run: npm run cf-typegen

      - name: Build site (dev)
        run: npm run build

      - name: Deploy to Cloudflare Workers (dev.alexpatterson.dev)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Cloudflare Worker Secrets (dev)
        run: |
          if [ -n "$SANITY_API_READ_TOKEN" ]; then
            echo "$SANITY_API_READ_TOKEN" | npx wrangler secret put SANITY_API_READ_TOKEN --env=""
          fi
          if [ -n "$SANITY_API_WRITE_TOKEN" ]; then
            echo "$SANITY_API_WRITE_TOKEN" | npx wrangler secret put SANITY_API_WRITE_TOKEN --env=""
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --env=""
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare Types
        run: npm run cf-typegen

      - name: Build site (production)
        run: npm run build:production

      - name: Deploy to Cloudflare Workers (alexpatterson.dev)
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Cloudflare Worker Secrets (production)
        run: |
          if [ -n "$SANITY_API_READ_TOKEN" ]; then
            echo "$SANITY_API_READ_TOKEN" | npx wrangler secret put SANITY_API_READ_TOKEN --env production
          fi
          if [ -n "$SANITY_API_WRITE_TOKEN" ]; then
            echo "$SANITY_API_WRITE_TOKEN" | npx wrangler secret put SANITY_API_WRITE_TOKEN --env production
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --env production
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
